[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/*.json"
exclude_filter="docs/*,build/*,tests/*,installer-prototype/*,scripts/*.py,.tools/*,assets/characters/upperbody-concept-v3.png,assets/characters/upperbody-pixel-v3.png,assets/evidence-models-v1/*,assets/evidence-models-v2/*.json,assets/evidence-models-v2/*.html,assets/evidence-models-v2/*.svg,assets/evidence-models-v2/previews/*,assets/evidence-models-v2/inventory-atlas.png,assets/evidence-models-v2/*/icon-64.png,assets/evidence-models-v2/*/front-32x32.png,assets/evidence-models-v2/*/secondary-32x32.png"
export_path="build/v10/windows/StartupPhase.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=".tools/windows_release_x86_64.exe"
custom_template/release=".tools/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
